name: Publish package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

# setup-uv@v6 still bundles Node 20; opt its JS action into Node 24 to
# clear the deprecation warning. Drop once setup-uv ships a Node 24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - run: uv venv
      - run: uv pip install build twine

      - name: Build wheel and sdist
        run: uv run python -m build

      - name: Publish to GitHub Packages
        run: |
          uv run twine upload \
            --repository-url https://pypi.pkg.github.com/${{ github.repository_owner }} \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            dist/*
